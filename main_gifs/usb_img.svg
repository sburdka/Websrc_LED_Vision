<!-- Selected / active state (green highlight) -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#0d1117"/>
  <!-- USB connector -->
  <rect x="88" y="18" width="24" height="55" fill="#4CAF50" rx="4"/>
  <rect x="80" y="68" width="40" height="12" fill="#4CAF50" rx="3"/>
  <rect x="93" y="78" width="14" height="28" fill="#4CAF50"/>
  <circle cx="100" cy="115" r="5" fill="#1b5e20"/>
  <!-- Image icon frame -->
  <rect x="30" y="125" width="140" height="52" fill="none" stroke="#4CAF50" stroke-width="3" rx="6"/>
  <!-- sun -->
  <circle cx="58" cy="143" r="9" fill="#4CAF50"/>
  <!-- mountains -->
  <polygon points="34,177 65,150 90,163 120,143 166,177" fill="#4CAF50"/>
  <!-- label -->
  <text x="100" y="196" text-anchor="middle" fill="#4CAF50" font-family="Arial,sans-serif"
        font-size="13" font-weight="bold">IMAGES</text>
</svg>
